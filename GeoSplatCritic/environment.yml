name: geosplat_critic
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - pip:
    - numpy
    - scipy
    - pyyaml
    - tqdm
    - transformers
    - accelerate
    - bitsandbytes
    - peft
    - deepspeed
    - wandb
    - plyfile
    - trimesh
    # Note: 3D sparse convolution libraries (like MinkowskiEngine or torch-points3d) 
    # often require specific system-level CUDA compilation and should be 
    # installed separately per hardware instructions.
